name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/chimera/target
          key: chimera-wasm-${{ hashFiles('.gitmodules', 'vendor/chimera/Cargo.lock') }}-${{ github.sha }}
          restore-keys: chimera-wasm-${{ hashFiles('.gitmodules', 'vendor/chimera/Cargo.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The pitch-training tools (training/README.md): their own tests, on CPU.
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy soundfile praat-parselmouth tqdm pytest
      - run: pytest -q

  # Publishes main to GitHub Pages. Needs Pages turned on once: repository Settings → Pages →
  # Source: GitHub Actions. Until then this job fails and the build above still reports.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
