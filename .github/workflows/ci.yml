name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a pull request's newer push cancels its older run. Pushes to main run one at a time, in order,
  # and none is cancelled once started: two merges seconds apart used to build side by side, and
  # whichever finished last was published, which could be the older one. (A push still waiting
  # when a newer one arrives is dropped; the newer one has everything it had.)
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/chimera/target
          key: chimera-wasm-${{ hashFiles('.gitmodules', 'vendor/chimera/Cargo.lock') }}-${{ github.sha }}
          restore-keys: chimera-wasm-${{ hashFiles('.gitmodules', 'vendor/chimera/Cargo.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # the speak command Hermes runs (dist/speak/), on the Node it runs on there
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node tests/speak.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # the same files, for the dist branch (below)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  # The pitch-training tools (training/README.md): their own tests, on CPU.
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy soundfile praat-parselmouth tqdm pytest
      - run: pytest -q

  # Publishes main to GitHub Pages. Needs Pages turned on once: repository Settings → Pages →
  # Source: GitHub Actions. Until then this job fails and the build above still reports.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # The built site on branch `dist`: one commit per push to main, its message naming the pushed
  # commit's full SHA, index.html at the root. A server can pin a commit of it and serve the files
  # as they are, building nothing (the NAS does: see "Using it with Hermes Agent" in the README).
  dist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Commit the build to dist
        env:
          SOURCE: ${{ github.sha }}
          SITE: ${{ runner.temp }}/site
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898231+github-actions[bot]@users.noreply.github.com"
          # another push's build may land first: then start again on top of it
          for attempt in 1 2 3 4 5; do
            # main has moved on (a re-run of an old job, say): its own build is the one to publish
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SOURCE" ]; then
              echo "main is no longer at $SOURCE; not publishing this build"
              exit 0
            fi
            if git fetch -q --depth=1 origin dist; then
              # a re-run of this job: the build is already there
              if git log -1 --format=%s FETCH_HEAD | grep -q "$SOURCE"; then exit 0; fi
              git checkout -q -f --detach FETCH_HEAD
            else
              git checkout -q -f --orphan "build-$attempt" # the first build: dist doesn't exist yet
            fi
            git rm -rqf --ignore-unmatch .
            git clean -fdxq
            cp -R "$SITE"/. .
            git add -A
            git commit -q --allow-empty -m "Build of $SOURCE" -m "https://github.com/$REPO/commit/$SOURCE"
            if git push -q origin HEAD:refs/heads/dist; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
