<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0c" />
    <title>Chimera Voice Chat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Chimera Voice Chat</h1>
      <span id="status" class="status">loading the voice…</span>
      <button id="open-settings" class="ghost" aria-label="Settings">Settings</button>
    </header>

    <main id="log" aria-live="polite"></main>

    <section id="caption" class="caption" aria-hidden="true"></section>

    <footer>
      <form id="composer">
        <input id="text" type="text" autocomplete="off" placeholder="Type, or tap the mic and talk" />
        <button id="send" type="submit" class="ghost">Send</button>
      </form>
      <button id="mic" class="mic" aria-label="Talk" disabled><span id="mic-label">Talk</span></button>
      <p id="hint" class="hint"></p>
    </footer>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Settings</h2>
        <label>API key <small>kept only in this browser</small>
          <input name="apiKey" type="password" autocomplete="off" placeholder="sk-or-…" />
        </label>
        <label>Endpoint <small>any OpenAI-compatible API</small>
          <input name="baseUrl" type="url" />
        </label>
        <label>Model
          <input name="model" type="text" list="models" autocomplete="off" />
          <datalist id="models"></datalist>
        </label>
        <label>Voice
          <select name="body">
            <option value="male">Adult male</option>
            <option value="female">Adult female</option>
            <option value="child">Child</option>
          </select>
        </label>
        <label>Speed <output data-for="rate"></output>
          <input name="rate" type="range" min="0.6" max="1.6" step="0.05" />
        </label>
        <label>Pitch <output data-for="pitch"></output>
          <input name="pitch" type="range" min="0.6" max="1.8" step="0.05" />
        </label>
        <label class="row"><input name="handsFree" type="checkbox" /> Keep listening after each reply</label>
        <label>Personality
          <textarea name="systemPrompt" rows="5"></textarea>
        </label>
        <div class="actions">
          <button type="button" id="test-voice" class="ghost">Test voice</button>
          <button type="button" id="reset-prompt" class="ghost">Reset personality</button>
          <button type="submit" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
