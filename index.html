<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chimera" />
    <title>Chimera Voice Chat</title>
    <script type="module" crossorigin src="./assets/index-BytMHohT.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/chimera-Bfcz9EKM.js">
    <link rel="modulepreload" crossorigin href="./assets/body-DG0xny6z.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DcG7td8F.css">
  </head>
  <body>
    <header>
      <h1>Chimera Voice Chat</h1>
      <span id="status" class="status">loading the voice…</span>
      <button id="open-chats" class="ghost" aria-label="Conversations" hidden>Chats</button>
      <button id="open-settings" class="ghost" aria-label="Settings">Settings</button>
    </header>

    <div class="middle">
      <section id="stage" class="stage" hidden></section>
      <div class="talk">
        <main id="log" aria-live="polite"></main>
        <section id="caption" class="caption" aria-hidden="true"></section>
      </div>
    </div>

    <footer>
      <form id="composer">
        <input id="text" type="text" autocomplete="off" placeholder="Type, or tap the mic and talk" />
        <button id="send" type="submit" class="ghost">Send</button>
      </form>
      <button id="mic" class="mic" aria-label="Talk" disabled><span id="mic-label">Talk</span></button>
      <p id="hint" class="hint"></p>
    </footer>

    <dialog id="chats">
      <form method="dialog" class="chats">
        <h2>Conversations <small>kept by Hermes, on every device with its key</small></h2>
        <button type="button" id="new-chat" class="primary">New conversation</button>
        <p id="chats-note" class="chats-note"></p>
        <ul id="chat-list" class="chat-list"></ul>
        <div class="actions">
          <button type="submit" class="ghost">Close</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Settings</h2>
        <label>Chat with
          <select name="backend">
            <option value="openrouter">OpenRouter</option>
            <option value="hermes">Hermes Agent</option>
            <option value="custom">Other (OpenAI-compatible)</option>
          </select>
          <small id="backend-hint"></small>
        </label>
        <label>API key <small>kept only in this browser</small>
          <input name="apiKey" type="password" autocomplete="off" placeholder="sk-or-…" />
        </label>
        <label>Endpoint <small>any OpenAI-compatible API</small>
          <input name="baseUrl" type="url" />
        </label>
        <label>Model
          <input name="model" type="text" list="models" autocomplete="off" />
          <datalist id="models"></datalist>
        </label>
        <label>Reasoning <small>thinking first is smarter, and slower to start speaking</small>
          <select name="reasoning">
            <option value="off">Off (fastest)</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="row" id="zdr-row"><input name="zdr" type="checkbox" /> Zero data retention <small>OpenRouter: only providers that keep nothing</small></label>
        <label>Voice
          <select name="body">
            <option value="male">Adult male</option>
            <option value="female">Adult female</option>
            <option value="child">Child</option>
          </select>
        </label>
        <label>Speed <output data-for="rate"></output>
          <input name="rate" type="range" min="0.6" max="1.6" step="0.05" />
        </label>
        <label>Pitch <output data-for="pitch"></output>
          <input name="pitch" type="range" min="0.6" max="1.8" step="0.05" />
        </label>
        <label class="row"><input name="naturalPitch" type="checkbox" /> Natural pitch <small>off is Chimera's own flat robot</small></label>
        <label class="row" id="trained-row" hidden><input name="trainedPitch" type="checkbox" /> Trained pitch model <small>learned from recordings; off uses the rules</small></label>
        <label class="row"><input name="handsFree" type="checkbox" /> Keep listening after each reply</label>
        <label class="row"><input name="bargeIn" type="checkbox" /> Interrupt it by talking <small>works best with headphones</small></label>
        <label class="row"><input name="showHead" type="checkbox" /> Show the head <small>turn off on a slow phone</small></label>
        <label>Personality
          <textarea name="systemPrompt" rows="5"></textarea>
        </label>
        <div class="actions">
          <button type="button" id="test-voice" class="ghost">Test voice</button>
          <button type="button" id="reset-prompt" class="ghost">Reset personality</button>
          <button type="submit" class="primary">Done</button>
        </div>
      </form>
    </dialog>

  </body>
</html>
